<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Martian+Mono:wdth,wght@75..112.5,300..700&family=Tektur:wdth,wght@75..100,400..900&display=swap">
<style>
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 1px; padding: 24px; }
.cell { display: grid; justify-items: center; gap: 10px; padding: 18px 8px 14px; background: var(--hull); color: var(--ink); font-size: 28px; }
.cell .ab-anno { font-size: 9px; }
.c-gun { color: var(--command); } .c-hull { color: var(--signal); } .c-ship { color: var(--krail); }
</style>
</head>
<body>
<div class="grid"><div class="cell c-gun"><i class="ab-i ab-i--weapons " aria-hidden="true"></i><span class="ab-anno">weapons</span></div><div class="cell c-hull"><i class="ab-i ab-i--defence " aria-hidden="true"></i><span class="ab-anno">defence</span></div><div class="cell c-ship"><i class="ab-i ab-i--ship " aria-hidden="true"></i><span class="ab-anno">ship</span></div><div class="cell"><i class="ab-i ab-i--hull " aria-hidden="true"></i><span class="ab-anno">hull</span></div><div class="cell"><i class="ab-i ab-i--krail " aria-hidden="true"></i><span class="ab-anno">krail</span></div><div class="cell"><i class="ab-i ab-i--overcharge " aria-hidden="true"></i><span class="ab-anno">overcharge</span></div><div class="cell"><i class="ab-i ab-i--chain " aria-hidden="true"></i><span class="ab-anno">chain</span></div><div class="cell"><i class="ab-i ab-i--capital " aria-hidden="true"></i><span class="ab-anno">capital</span></div><div class="cell"><i class="ab-i ab-i--score " aria-hidden="true"></i><span class="ab-anno">score</span></div><div class="cell"><i class="ab-i ab-i--torpedo " aria-hidden="true"></i><span class="ab-anno">torpedo</span></div><div class="cell"><i class="ab-i ab-i--mine " aria-hidden="true"></i><span class="ab-anno">mine</span></div><div class="cell"><i class="ab-i ab-i--alert " aria-hidden="true"></i><span class="ab-anno">alert</span></div><div class="cell"><i class="ab-i ab-i--all-stop " aria-hidden="true"></i><span class="ab-anno">all-stop</span></div></div>
</body>
</html>
