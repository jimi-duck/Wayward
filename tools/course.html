<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayward: Course bench</title>
  <link rel="stylesheet" href="../src/styles/main.css">
  <link rel="stylesheet" href="../src/styles/hud.css">
  <link rel="stylesheet" href="../src/styles/title.css">
  <link rel="stylesheet" href="../src/styles/dock.css">
  <link rel="stylesheet" href="../src/styles/chart.css">
  <link rel="stylesheet" href="../src/styles/course.css">
  <link rel="stylesheet" href="../src/styles/neon-frames.css">
  <link rel="stylesheet" href="../src/styles/neon.css">
</head>
<body>
  <!-- The Course screen on its own (dev server only), no game behind it, for screenshots.
       ?stop=3 (column to stand at)  ?seed=3 -->
  <div id="app">
    <div id="course" class="sheet" role="dialog" aria-labelledby="co-t" hidden>
      <div class="panel wide chartp coursep">
        <header class="ch-head">
          <span class="kick" id="co-k"></span>
          <div id="co-res" class="ch-res" aria-label="The ship’s stores"></div>
          <div class="ch-l2"><h2 id="co-t">Course</h2><div id="co-gate" class="ch-gate"></div></div>
        </header>
        <div class="ch-body">
          <div class="ch-mapw">
            <svg id="co-map" class="ch-map" viewBox="0 0 640 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The road: one line of stops to the Narrows."></svg>
          </div>
          <p id="co-blurb" class="co-blurb"></p>
        </div>
        <div class="ch-aux">
        <details id="co-wall" class="ch-intel ch-wall"><summary><span id="co-wall-s">Wall</span></summary>
          <p id="co-wall-lead" class="ch-goal"></p>
          <ul id="co-wall-l" class="ch-wall-l"></ul>
        </details>
        </div>
        <footer class="ch-foot">
          <div class="ch-warn"><p id="co-purs" class="co-purs"></p><p id="co-debt" class="co-purs rest" hidden></p><p id="co-why" class="ch-why" hidden></p></div>
          <div class="ch-acts"><button type="button" id="co-go">Jump</button></div>
          <p class="ch-hint"><span class="keys" data-i18n="html"><kbd>Enter</kbd> · <kbd>W</kbd> Wall</span></p>
        </footer>
      </div>
    </div>
  </div>
  <script type="module" src="./course.ts"></script>
</body>
</html>
